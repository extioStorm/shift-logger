<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Logger</title>

<link rel="icon" type="image/png" sizes="48x48" href="shift-logger-favicon-48.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #f0f0f0;
        margin: 0;
        padding: 6px 10px;
    }

    .container {
        max-width: 500px;
        margin: auto;
    }

    h2 {
        text-align: center;
        color: #66ff99;
        margin: 0 0 6px 0;
        font-size: 1.2rem;
    }

    label {
        display: block;
        margin-top: 5px;
        margin-bottom: 2px;
        font-weight: bold;
        font-size: 13px;
    }

    input,
    select,
    textarea,
    button {
        font-size: 15px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #2b2b2b;
        color: #fff;
    }

    button {
        padding: 8px;
        margin-top: 6px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .profile-row {
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .profile-row select {
        flex: 1;
    }

    .small-button {
        width: auto;
        white-space: nowrap;
        padding: 6px 10px;
    }

    .two-column {
        display: flex;
        gap: 6px;
    }

    .two-column > div {
        flex: 1;
    }

    .profile-buttons {
        display: flex;
        gap: 6px;
        margin-top: 6px;
    }

    .profile-buttons button {
        flex: 1;
    }

    .checkbox-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        color: #66ff99;
        font-size: 13px;
    }

    .checkbox-row input[type="checkbox"] {
        width: auto;
        margin: 0;
        transform: scale(1.1);
    }

    .checkbox-row label {
        margin: 0;
        color: #66ff99;
        font-weight: normal;
    }

    .checkbox-row input[type="checkbox"]:disabled {
        opacity: 0.45;
    }

    .checkbox-row input[type="checkbox"]:disabled + label {
        color: #666;
    }

    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 12px;
        row-gap: 2px;
        width: 100%;
        margin-top: 6px;
    }

    .options-grid .checkbox-row {
        margin-top: 0;
    }

    /* Thin Bar Collapsible Panels */
    details {
        background: #252525;
        border: 1px solid #3c3c3c;
        border-radius: 4px;
        margin-top: 6px;
        padding: 0;
        overflow: hidden;
    }

    details > summary::-webkit-details-marker {
        display: none;
    }

    summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: bold;
        color: #66ff99;
        cursor: pointer;
        font-size: 13px;
        user-select: none;
        padding: 5px 10px;
        background: #2a2a2a;
        line-height: 1.2;
    }

    summary:hover {
        background: #333;
    }

    summary::after {
        content: "▶";
        font-size: 10px;
        color: #66ff99;
        transition: transform 0.15s ease;
    }

    details[open] > summary::after {
        transform: rotate(90deg);
    }

    details[open] {
        padding-bottom: 8px;
    }

    details > *:not(summary) {
        margin-left: 8px;
        margin-right: 8px;
        width: calc(100% - 16px);
    }

    textarea {
        height: 95px;
        min-height: 80px;
        resize: vertical;
        margin-top: 4px;
        font-family: monospace;
        font-size: 13px;
    }

    .primary {
        width: 100%;
        background: #168a45;
        color: white;
        font-weight: bold;
        padding: 10px;
        margin-top: 8px;
    }

    .secondary {
        background: #444;
        color: white;
    }

    .danger {
        background: #8b2020;
        color: white;
    }

    .now-button {
        width: 100%;
        background: #444;
        color: #66ff99;
        padding: 8px;
        font-size: 14px;
    }

    .output-label {
        margin-top: 6px;
        color: #66ff99;
    }

    .label-hint {
        color: #888;
        font-weight: normal;
        font-size: 12px;
        margin-left: 4px;
    }
</style>
</head>

<body>

<div class="container">

<h2>Shift Logger</h2>

<div class="profile-row">
    <select id="profileSelect" onchange="loadSelectedProfile()"></select>
    <button class="small-button secondary" onclick="createNewBlankProfile()">+ New</button>
</div>

<details id="jobDetailsPanel">
    <summary>Job & Project Details</summary>

    <label for="jobNum">Job Number:</label>
    <input type="text" id="jobNum" autocomplete="off">

    <label for="fedProject">State/Federal Project ID:</label>
    <input type="text" id="fedProject" autocomplete="off">

    <div class="two-column" style="width: 100%; margin: 0;">
        <div>
            <label for="location">Location / Hwy / Plant:</label>
            <input type="text" id="location" autocomplete="off">
        </div>

        <div>
            <label for="payItem">Pay Item / Code:</label>
            <input type="text" id="payItem" autocomplete="off">
        </div>
    </div>

    <label for="truck">Vehicle / Notes:</label>
    <input type="text" id="truck" autocomplete="off">

    <div class="profile-buttons" style="width: 100%; margin: 6px 0 0 0;">
        <button class="secondary" onclick="saveProfile()">Save Profile</button>
        <button class="danger" onclick="deleteProfile()">Delete Profile</button>
    </div>
</details>

<label for="shiftDate">Start Date of Shift:</label>
<input type="date" id="shiftDate" onchange="shiftDateManuallyChanged()">

<div class="two-column" style="margin-top: 4px;">
    <div>
        <label for="startTime">Start Time:</label>
        <select id="startTime" onchange="updateAutomaticShiftDate()"></select>
    </div>

    <div>
        <label for="endTime">End Time:</label>
        <select id="endTime" onchange="updateAutomaticShiftDate()"></select>
    </div>
</div>

<div id="unpaidBreakGroup" style="display: none;">
    <label for="breakMins">Unpaid Break:</label>
    <select id="breakMins">
        <option value="0">None</option>
        <option value="15">15 mins</option>
        <option value="30">30 mins</option>
        <option value="45">45 mins</option>
        <option value="60">60 mins (1 hr)</option>
        <option value="90">90 mins (1.5 hrs)</option>
        <option value="120">120 mins (2 hrs)</option>
    </select>
</div>

<button class="now-button" id="nowButton" onclick="setEndToNow()">
    Set End Time to NOW (Rounded 30m)
</button>

<!-- Previous Odometer dynamically hidden/shown based on 'Show Previous Odometer' check -->
<div id="previousOdometerGroup" style="display: none;">
    <label for="previousOdometer">Previous Odometer:</label>
    <input
        type="number"
        id="previousOdometer"
        inputmode="numeric"
        onclick="this.select()"
    >
</div>

<label for="odometer">Ending Odometer: <span class="label-hint">(0 for none)</span></label>
<input
    type="number"
    id="odometer"
    inputmode="numeric"
    onclick="this.select()"
>

<details id="shiftOptionsPanel">
    <summary>Shift Options</summary>

    <div class="options-grid">
        <div class="checkbox-row">
            <input type="checkbox" id="showPreviousOdometer" onchange="togglePreviousOdometer()">
            <label for="showPreviousOdometer">Show Previous Odometer</label>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="includeMilesDriven" onchange="toggleIncludeMilesDriven()" disabled>
            <label for="includeMilesDriven">Include Driven Miles</label>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="useQuarterHour" onchange="timeRoundingChanged()">
            <label for="useQuarterHour">Use 15-minute increments</label>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="showUnpaidBreak" onchange="toggleUnpaidBreak()">
            <label for="showUnpaidBreak">Show unpaid break</label>
        </div>
    </div>

    <button type="button" class="secondary" style="width: 100%; margin-top: 8px;" onclick="saveProfile()">Save Settings &amp; Profile</button>
</details>

<button class="primary" onclick="generateLog()">
    Generate & Copy Log
</button>

<label class="output-label" for="output">Output:</label>
<textarea id="output" readonly></textarea>

</div>

<script>
const STORAGE_KEY = "shift_profiles";
const LAST_PROFILE_KEY = "last_active_profile";

let shiftDateWasManuallyChanged = false;

const defaultProfile = {
    name: "Plant Day",
    jobNum: "362304",
    fedProject: "",
    location: "Plant",
    payItem: "424A360",
    truck: "Silver truck",
    startTime: "--",
    endTime: "--",
    previousOdometer: "",
    usePreviousOdometer: false,
    showPreviousOdometer: false,
    includeMilesDriven: false,
    useQuarterHour: false,
    showUnpaidBreak: false
};

function togglePreviousOdometer() {
    const showPrevious = document.getElementById("showPreviousOdometer").checked;
    const group = document.getElementById("previousOdometerGroup");
    const includeMiles = document.getElementById("includeMilesDriven");

    group.style.display = showPrevious ? "block" : "none";
    includeMiles.disabled = !showPrevious;

    if (!showPrevious) {
        includeMiles.checked = false;
    }
}

function toggleIncludeMilesDriven() {
    const showPrevious = document.getElementById("showPreviousOdometer").checked;
    const includeMiles = document.getElementById("includeMilesDriven");

    if (!showPrevious) {
        includeMiles.checked = false;
        includeMiles.disabled = true;
    }
}

function toggleUnpaidBreak() {
    const showBreak = document.getElementById("showUnpaidBreak").checked;
    const group = document.getElementById("unpaidBreakGroup");
    const breakSelect = document.getElementById("breakMins");

    group.style.display = showBreak ? "block" : "none";

    if (!showBreak) {
        breakSelect.value = "0";
    }
}

function getProfiles() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) return [defaultProfile];

    try {
        const profiles = JSON.parse(stored);
        if (!Array.isArray(profiles) || profiles.length === 0) return [defaultProfile];

        profiles.forEach(profile => {
            if (!("previousOdometer" in profile)) profile.previousOdometer = "";
            if (!("usePreviousOdometer" in profile)) profile.usePreviousOdometer = false;

            /*
             * Backward compatibility:
             * Older profiles used usePreviousOdometer for both
             * showing the field and including miles.
             */
            if (!("showPreviousOdometer" in profile)) {
                profile.showPreviousOdometer = profile.usePreviousOdometer === true;
            }

            if (!("includeMilesDriven" in profile)) {
                profile.includeMilesDriven = profile.usePreviousOdometer === true;
            }

            if (!("useQuarterHour" in profile)) profile.useQuarterHour = false;
            if (!("showUnpaidBreak" in profile)) profile.showUnpaidBreak = false;

            if (!("location" in profile) && ("hwy" in profile)) {
                profile.location = profile.hwy;
            }
        });

        return profiles;
    } catch (error) {
        return [defaultProfile];
    }
}

function saveProfiles(profiles) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
}

function renderProfiles() {
    const select = document.getElementById("profileSelect");
    const profiles = getProfiles();
    select.innerHTML = "";

    profiles.forEach((profile, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = profile.name;
        select.appendChild(option);
    });
}

function loadSelectedProfile() {
    const select = document.getElementById("profileSelect");
    if (select.value === "new") return;

    const profiles = getProfiles();
    const index = Number(select.value);

    if (!profiles[index]) return;

    const profile = profiles[index];

    document.getElementById("jobNum").value = profile.jobNum || "";
    document.getElementById("fedProject").value = profile.fedProject || "";
    document.getElementById("location").value = profile.location || profile.hwy || "";
    document.getElementById("payItem").value = profile.payItem || "";
    document.getElementById("truck").value = profile.truck || "";

    document.getElementById("previousOdometer").value = profile.previousOdometer || "";

    document.getElementById("showPreviousOdometer").checked =
        profile.showPreviousOdometer === true;

    document.getElementById("includeMilesDriven").checked =
        profile.includeMilesDriven === true;

    document.getElementById("useQuarterHour").checked =
        profile.useQuarterHour === true;

    document.getElementById("showUnpaidBreak").checked =
        profile.showUnpaidBreak === true;

    togglePreviousOdometer();
    toggleUnpaidBreak();

    populateTimes(profile.useQuarterHour === true);

    document.getElementById("startTime").value = profile.startTime || "--";
    document.getElementById("endTime").value = profile.endTime || "--";

    updateNowButtonText();
    localStorage.setItem(LAST_PROFILE_KEY, String(index));
}

function createNewBlankProfile() {
    const select = document.getElementById("profileSelect");

    let newOption = select.querySelector('option[value="new"]');

    if (!newOption) {
        newOption = document.createElement("option");
        newOption.value = "new";
        newOption.textContent = "-- Unsaved New Profile --";
        select.appendChild(newOption);
    }

    newOption.selected = true;
    select.value = "new";

    document.getElementById("jobNum").value = "";
    document.getElementById("fedProject").value = "";
    document.getElementById("location").value = "";
    document.getElementById("payItem").value = "";
    document.getElementById("truck").value = "";

    document.getElementById("useQuarterHour").checked = false;
    populateTimes(false);

    document.getElementById("startTime").value = "--";
    document.getElementById("endTime").value = "--";

    document.getElementById("previousOdometer").value = "";
    document.getElementById("showPreviousOdometer").checked = false;
    document.getElementById("includeMilesDriven").checked = false;

    document.getElementById("showUnpaidBreak").checked = false;
    document.getElementById("breakMins").value = "0";

    togglePreviousOdometer();
    toggleUnpaidBreak();

    shiftDateWasManuallyChanged = false;
    updateAutomaticShiftDate();
    updateNowButtonText();

    document.getElementById("jobDetailsPanel").open = true;
    document.getElementById("jobNum").focus();
}

function saveProfile() {
    const profiles = getProfiles();
    const select = document.getElementById("profileSelect");

    let selectedIndex = select.value === "new" ? -1 : Number(select.value);
    let existingProfile = profiles[selectedIndex];
    let profileName;

    if (existingProfile) {
        if (!confirm("Overwrite the current profile?")) return;
        profileName = existingProfile.name;
    } else {
        const locVal = document.getElementById("location").value.trim();
        const jobVal = document.getElementById("jobNum").value.trim();
        const payVal = document.getElementById("payItem").value.trim();
        const truckVal = document.getElementById("truck").value.trim();

        let defaultName = "";

        if (locVal && jobVal) defaultName = `${locVal} (${jobVal})`;
        else if (locVal) defaultName = locVal;
        else if (jobVal) defaultName = `Job ${jobVal}`;
        else if (payVal) defaultName = `Pay Item ${payVal}`;
        else if (truckVal) defaultName = truckVal;
        else defaultName = "Plant Day";

        profileName = prompt("Enter a name for this profile:", defaultName);

        if (!profileName) return;
    }

    const showPreviousOdometer =
        document.getElementById("showPreviousOdometer").checked;

    const includeMilesDriven =
        document.getElementById("includeMilesDriven").checked;

    const profile = {
        name: profileName,
        jobNum: document.getElementById("jobNum").value.trim(),
        fedProject: document.getElementById("fedProject").value.trim(),
        location: document.getElementById("location").value.trim(),
        payItem: document.getElementById("payItem").value.trim(),
        truck: document.getElementById("truck").value.trim(),
        startTime: document.getElementById("startTime").value,
        endTime: document.getElementById("endTime").value,
        previousOdometer: document.getElementById("previousOdometer").value.trim(),

        showPreviousOdometer: showPreviousOdometer,
        includeMilesDriven: includeMilesDriven,

        // Retain the old field for compatibility with older versions.
        usePreviousOdometer: includeMilesDriven,

        useQuarterHour: document.getElementById("useQuarterHour").checked,
        showUnpaidBreak: document.getElementById("showUnpaidBreak").checked
    };

    if (existingProfile) {
        profiles[selectedIndex] = profile;
    } else {
        profiles.push(profile);
    }

    saveProfiles(profiles);
    renderProfiles();

    const newIndex = existingProfile ? selectedIndex : profiles.length - 1;

    document.getElementById("profileSelect").value = String(newIndex);
    localStorage.setItem(LAST_PROFILE_KEY, String(newIndex));

    alert("Profile saved.");
}

function deleteProfile() {
    const select = document.getElementById("profileSelect");

    if (select.value === "new") {
        renderProfiles();
        loadSelectedProfile();
        return;
    }

    const profiles = getProfiles();
    const index = Number(select.value);

    if (!profiles[index]) return;
    if (!confirm("Delete the current profile?")) return;

    profiles.splice(index, 1);

    if (profiles.length === 0) {
        profiles.push(defaultProfile);
    }

    saveProfiles(profiles);
    localStorage.removeItem(LAST_PROFILE_KEY);

    renderProfiles();
    createNewBlankProfile();
}

function populateTimes(useQuarterHour) {
    const start = document.getElementById("startTime");
    const end = document.getElementById("endTime");

    const oldStart = start.value;
    const oldEnd = end.value;

    start.innerHTML = "";
    end.innerHTML = "";

    const p1 = document.createElement("option");
    p1.value = "--";
    p1.textContent = "--";
    start.appendChild(p1);

    const p2 = document.createElement("option");
    p2.value = "--";
    p2.textContent = "--";
    end.appendChild(p2);

    const increment = useQuarterHour ? 15 : 30;

    for (let hour = 0; hour < 24; hour++) {
        for (let minute = 0; minute < 60; minute += increment) {
            const value =
                String(hour).padStart(2, "0") +
                ":" +
                String(minute).padStart(2, "0");

            const opt1 = document.createElement("option");
            opt1.value = value;
            opt1.textContent = formatTime(value);
            start.appendChild(opt1);

            const opt2 = document.createElement("option");
            opt2.value = value;
            opt2.textContent = formatTime(value);
            end.appendChild(opt2);
        }
    }

    start.value =
        Array.from(start.options).some(o => o.value === oldStart)
            ? oldStart
            : "--";

    end.value =
        Array.from(end.options).some(o => o.value === oldEnd)
            ? oldEnd
            : "--";
}

function timeRoundingChanged() {
    const useQuarterHour =
        document.getElementById("useQuarterHour").checked;

    populateTimes(useQuarterHour);
    updateNowButtonText();
    updateAutomaticShiftDate();
}

function updateNowButtonText() {
    const useQuarterHour =
        document.getElementById("useQuarterHour").checked;

    document.getElementById("nowButton").textContent =
        useQuarterHour
            ? "Set End Time to NOW (Rounded 15m)"
            : "Set End Time to NOW (Rounded 30m)";
}

function formatTime(timeValue) {
    const parts = timeValue.split(":");
    let hour = Number(parts[0]);
    const minute = parts[1];

    const suffix = hour >= 12 ? "PM" : "AM";

    hour = hour % 12 || 12;

    return hour + ":" + minute + " " + suffix;
}

function shiftDateManuallyChanged() {
    shiftDateWasManuallyChanged =
        !!document.getElementById("shiftDate").value;
}

function updateAutomaticShiftDate() {
    if (shiftDateWasManuallyChanged) return;

    const startVal = document.getElementById("startTime").value;
    const endVal = document.getElementById("endTime").value;

    if (
        !startVal ||
        startVal === "--" ||
        !endVal ||
        endVal === "--"
    ) return;

    const startParts = startVal.split(":");
    const endParts = endVal.split(":");

    const startMinutes =
        Number(startParts[0]) * 60 + Number(startParts[1]);

    const endMinutes =
        Number(endParts[0]) * 60 + Number(endParts[1]);

    const date = new Date();

    if (endMinutes < startMinutes) {
        date.setDate(date.getDate() - 1);
    }

    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    const dd = String(date.getDate()).padStart(2, "0");

    document.getElementById("shiftDate").value =
        yyyy + "-" + mm + "-" + dd;
}

function setEndToNow() {
    const now = new Date();

    let hour = now.getHours();
    let minute = now.getMinutes();

    const useQuarterHour =
        document.getElementById("useQuarterHour").checked;

    if (useQuarterHour) {
        if (minute < 8) minute = 0;
        else if (minute < 23) minute = 15;
        else if (minute < 38) minute = 30;
        else if (minute < 53) minute = 45;
        else {
            minute = 0;
            hour = (hour + 1) % 24;
        }
    } else {
        if (minute < 15) minute = 0;
        else if (minute < 45) minute = 30;
        else {
            minute = 0;
            hour = (hour + 1) % 24;
        }
    }

    const value =
        String(hour).padStart(2, "0") +
        ":" +
        String(minute).padStart(2, "0");

    document.getElementById("endTime").value = value;

    if (!shiftDateWasManuallyChanged) {
        const startVal =
            document.getElementById("startTime").value;

        const targetDate = new Date(now);

        if (startVal && startVal !== "--") {
            const startParts = startVal.split(":");

            const startMinutes =
                Number(startParts[0]) * 60 +
                Number(startParts[1]);

            const endMinutes = hour * 60 + minute;

            if (endMinutes < startMinutes) {
                targetDate.setDate(targetDate.getDate() - 1);
            }
        }

        const yyyy = targetDate.getFullYear();
        const mm = String(targetDate.getMonth() + 1).padStart(2, "0");
        const dd = String(targetDate.getDate()).padStart(2, "0");

        document.getElementById("shiftDate").value =
            yyyy + "-" + mm + "-" + dd;
    }
}

const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const months = [
    "Jan", "Feb", "Mar", "Apr", "May", "Jun",
    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
];

function formatDate(date) {
    return (
        days[date.getDay()] +
        " " +
        months[date.getMonth()] +
        " " +
        date.getDate()
    );
}

function formatShiftDates(startDate, endDate) {
    const startYear = startDate.getFullYear();
    const endYear = endDate.getFullYear();

    if (startYear !== endYear) {
        return (
            formatDate(startDate) +
            ", " +
            startYear +
            " - " +
            formatDate(endDate) +
            ", " +
            endYear
        );
    }

    if (startDate.getMonth() !== endDate.getMonth()) {
        return formatDate(startDate) + "-" + formatDate(endDate);
    }

    if (startDate.getDate() !== endDate.getDate()) {
        return (
            days[startDate.getDay()] +
            "-" +
            days[endDate.getDay()] +
            " " +
            months[startDate.getMonth()] +
            " " +
            startDate.getDate() +
            "-" +
            endDate.getDate()
        );
    }

    return formatDate(startDate);
}

function generateLog() {
    if (!shiftDateWasManuallyChanged) {
        updateAutomaticShiftDate();
    }

    const jobNum =
        document.getElementById("jobNum").value.trim();

    const fedProject =
        document.getElementById("fedProject").value.trim();

    const locationVal =
        document.getElementById("location").value.trim();

    const payItem =
        document.getElementById("payItem").value.trim();

    const truck =
        document.getElementById("truck").value.trim();

    const startTime =
        document.getElementById("startTime").value;

    const endTime =
        document.getElementById("endTime").value;

    const showUnpaidBreak =
        document.getElementById("showUnpaidBreak").checked;

    const breakMins = showUnpaidBreak
        ? Number(document.getElementById("breakMins").value)
        : 0;

    const shiftDateValue =
        document.getElementById("shiftDate").value;

    const previousOdometer =
        document.getElementById("previousOdometer").value.trim();

    const showPreviousOdometer =
        document.getElementById("showPreviousOdometer").checked;

    const includeMilesDriven =
        document.getElementById("includeMilesDriven").checked;

    const odometer =
        document.getElementById("odometer").value.trim();

    if (!startTime || startTime === "--") {
        alert("Please select a Start Time.");
        document.getElementById("startTime").focus();
        return;
    }

    if (!endTime || endTime === "--") {
        alert("Please select an End Time.");
        document.getElementById("endTime").focus();
        return;
    }

    if (odometer === "") {
        alert(
            "Please enter the Ending Odometer " +
            "(or enter 0 for personal vehicle)."
        );
        document.getElementById("odometer").focus();
        return;
    }

    if (!shiftDateValue) {
        alert("Please select a Start Date of Shift.");
        document.getElementById("shiftDate").focus();
        return;
    }

    let milesDriven = null;

    if (includeMilesDriven && odometer !== "0") {
        if (!previousOdometer) {
            alert(
                "Include Driven Miles is checked, " +
                "but Previous Odometer is blank."
            );
            document.getElementById("previousOdometer").focus();
            return;
        }

        const previous = Number(previousOdometer);
        const ending = Number(odometer);

        if (ending < previous) {
            alert(
                "Ending odometer cannot be less than Previous Odometer."
            );
            document.getElementById("odometer").focus();
            return;
        }

        milesDriven = ending - previous;
    }

    const startDateParts = shiftDateValue.split("-");

    const startDate = new Date(
        Number(startDateParts[0]),
        Number(startDateParts[1]) - 1,
        Number(startDateParts[2])
    );

    const startParts = startTime.split(":");
    const endParts = endTime.split(":");

    const startHour = Number(startParts[0]);
    const startMinute = Number(startParts[1]);

    const endHour = Number(endParts[0]);
    const endMinute = Number(endParts[1]);

    const start = new Date(startDate);

    start.setHours(
        startHour,
        startMinute,
        0,
        0
    );

    const end = new Date(startDate);

    end.setHours(
        endHour,
        endMinute,
        0,
        0
    );

    if (
        endHour * 60 + endMinute <=
        startHour * 60 + startMinute
    ) {
        end.setDate(end.getDate() + 1);
    }

    // Pure wall-clock minute calculation (timezone-agnostic)
    let startTotalMins =
        startHour * 60 + startMinute;

    let endTotalMins =
        endHour * 60 + endMinute;

    if (endTotalMins <= startTotalMins) {
        endTotalMins += 24 * 60;
    }

    const rawWorkedMins =
        endTotalMins - startTotalMins;

    let totalHours =
        (rawWorkedMins / 60) -
        (breakMins / 60);

    if (totalHours < 0) {
        totalHours = 0;
    }

    let dstNote = "";

    if (
        start.getTimezoneOffset() !==
        end.getTimezoneOffset()
    ) {
        const isSpringForward =
            start.getTimezoneOffset() >
            end.getTimezoneOffset();

        const adjustmentAmount =
            isSpringForward ? -1 : 1;

        const adjustmentLabel =
            isSpringForward
                ? "-1 hour (Spring Forward)"
                : "+1 hour (Fall Back)";

        const applyAdjustment = confirm(
            "Daylight Saving Time change detected.\n\n" +
            "Calculated Hours (Raw): " +
            totalHours +
            "\n\n" +
            "Did your clock automatically update for DST?\n" +
            "Click OK to apply adjustment [" +
            adjustmentLabel +
            "]\n" +
            "Click Cancel to keep raw wall-clock hours."
        );

        if (applyAdjustment) {
            totalHours = Math.max(
                0,
                totalHours + adjustmentAmount
            );

            dstNote =
                " (DST adjusted: " +
                (isSpringForward ? "-1 hr" : "+1 hr") +
                ")";
        } else {
            dstNote =
                " (DST reviewed: no adjustment)";
        }
    }

    if (totalHours < 4 || totalHours > 16) {
        if (
            !confirm(
                "This shift calculates to " +
                totalHours +
                " hours.\n\n" +
                "Are you sure the start and end times are correct?"
            )
        ) return;
    }

    const lines = [];

    if (jobNum) {
        lines.push("Job#: " + jobNum);
    }

    if (fedProject) {
        lines.push(fedProject);
    }

    if (locationVal) {
        lines.push(locationVal);
    }

    if (payItem) {
        lines.push(payItem);
    }

    lines.push(
        "Date: " +
        formatShiftDates(start, end)
    );

    lines.push(
        "Hours: " +
        formatTime(startTime) +
        " - " +
        formatTime(endTime) +
        " (" +
        totalHours +
        " hours)" +
        dstNote
    );

    if (breakMins > 0) {
        lines.push(
            "Break: " +
            breakMins +
            "m unpaid"
        );
    }

    if (odometer !== "0") {
        lines.push(
            "Odometer: " +
            odometer
        );
    }

    if (
        includeMilesDriven &&
        milesDriven !== null
    ) {
        lines.push(
            "Miles: " +
            milesDriven
        );
    }

    if (truck) {
        lines.push(truck);
    }

    const output = lines.join("\n");

    document.getElementById("output").value = output;

    copyText(output);

    if (odometer !== "0") {
        updateProfilePreviousOdometer(odometer);
    }
}

function updateProfilePreviousOdometer(odometer) {
    const select =
        document.getElementById("profileSelect");

    if (select.value === "new") return;

    const profiles = getProfiles();
    const index = Number(select.value);

    if (profiles[index]) {
        profiles[index].previousOdometer =
            String(odometer);

        saveProfiles(profiles);
    }

    document.getElementById(
        "previousOdometer"
    ).value = String(odometer);
}

function copyText(text) {
    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {
        navigator.clipboard.writeText(text)
            .then(() => {
                alert("Log copied to clipboard.");
            })
            .catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const textarea =
        document.getElementById("output");

    textarea.focus();
    textarea.select();

    try {
        document.execCommand("copy");
        alert("Log copied to clipboard.");
    } catch (error) {
        alert(
            "Log generated, but automatic copying failed. " +
            "Please copy manually."
        );
    }
}

function init() {
    populateTimes(false);
    renderProfiles();

    const today = new Date();

    const yyyy = today.getFullYear();

    const mm =
        String(today.getMonth() + 1)
        .padStart(2, "0");

    const dd =
        String(today.getDate())
        .padStart(2, "0");

    document.getElementById("shiftDate").value =
        yyyy + "-" + mm + "-" + dd;

    shiftDateWasManuallyChanged = false;

    const profiles = getProfiles();

    const lastProfile =
        localStorage.getItem(LAST_PROFILE_KEY);

    if (
        lastProfile !== null &&
        profiles[Number(lastProfile)]
    ) {
        document.getElementById(
            "profileSelect"
        ).value = lastProfile;
    } else {
        document.getElementById(
            "profileSelect"
        ).value = "0";
    }

    loadSelectedProfile();

    document.getElementById(
        "odometer"
    ).value = "";
}

window.onload = init;
</script>
