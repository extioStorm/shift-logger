<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Logger</title>

<link rel="icon" type="image/png" sizes="48x48" href="shift-logger-favicon-48.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #f0f0f0;
        margin: 0;
        padding: 15px;
    }

    .container {
        max-width: 500px;
        margin: auto;
    }

    h2 {
        text-align: center;
        color: #66ff99;
        margin-top: 5px;
    }

    label {
        display: block;
        margin-top: 12px;
        margin-bottom: 4px;
        font-weight: bold;
    }

    input,
    select,
    textarea,
    button {
        box-sizing: border-box;
        font-size: 16px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #555;
        border-radius: 5px;
        background: #2b2b2b;
        color: #fff;
    }

    button {
        padding: 12px;
        margin-top: 8px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .profile-row {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    .profile-row select {
        flex: 1;
    }

    .small-button {
        width: auto;
        white-space: nowrap;
    }

    .two-column {
        display: flex;
        gap: 8px;
    }

    .two-column > div {
        flex: 1;
    }

    .profile-buttons {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }

    .profile-buttons button {
        flex: 1;
    }

    .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        color: #66ff99;
    }

    .checkbox-row input[type="checkbox"] {
        width: auto;
        margin: 0;
        transform: scale(1.25);
    }

    .checkbox-row label {
        margin: 0;
        color: #66ff99;
        font-weight: normal;
    }

    details {
        background: #252525;
        border: 1px solid #444;
        border-radius: 5px;
        margin-top: 15px;
        padding: 8px 12px;
    }

    summary {
        font-weight: bold;
        color: #66ff99;
        cursor: pointer;
        padding: 4px 0;
        user-select: none;
    }

    textarea {
        min-height: 170px;
        resize: vertical;
        margin-top: 8px;
    }

    .primary {
        width: 100%;
        background: #168a45;
        color: white;
        font-weight: bold;
        padding: 14px;
        margin-top: 15px;
    }

    .secondary {
        background: #444;
        color: white;
    }

    .danger {
        background: #8b2020;
        color: white;
    }

    .now-button {
        width: 100%;
        background: #444;
        color: #66ff99;
    }

    .output-label {
        margin-top: 15px;
        color: #66ff99;
    }

    .label-hint {
        color: #888;
        font-weight: normal;
        font-size: 14px;
        margin-left: 6px;
    }
</style>
</head>

<body>

<div class="container">

<h2>Shift Logger</h2>

<label for="profileSelect">Profile:</label>

<div class="profile-row">
    <select id="profileSelect" onchange="loadSelectedProfile()"></select>
    <button class="small-button secondary" onclick="createNewBlankProfile()">+ New</button>
</div>

<details id="jobDetailsPanel">
    <summary>Job & Project Details</summary>

    <label for="jobNum">Job Number:</label>
    <input type="text" id="jobNum" autocomplete="off">

    <label for="fedProject">State/Federal Project ID:</label>
    <input type="text" id="fedProject" autocomplete="off">

    <div class="two-column">
        <div>
            <label for="location">Location / Hwy / Plant:</label>
            <input type="text" id="location" autocomplete="off">
        </div>

        <div>
            <label for="payItem">Pay Item / Code:</label>
            <input type="text" id="payItem" autocomplete="off">
        </div>
    </div>

    <label for="truck">Vehicle / Notes:</label>
    <input type="text" id="truck" autocomplete="off">

    <div class="profile-buttons">
        <button class="secondary" onclick="saveProfile()">Save Profile</button>
        <button class="danger" onclick="deleteProfile()">Delete Profile</button>
    </div>
</details>

<label for="shiftDate">Start Date of Shift:</label>
<input type="date" id="shiftDate" onchange="shiftDateManuallyChanged()">

<div class="two-column">
    <div>
        <label for="startTime">Start Time:</label>
        <select id="startTime" onchange="updateAutomaticShiftDate()"></select>
    </div>

    <div>
        <label for="endTime">End Time:</label>
        <select id="endTime" onchange="updateAutomaticShiftDate()"></select>
    </div>
</div>

<button class="now-button" id="nowButton" onclick="setEndToNow()">
    Set End Time to NOW (Rounded 30m)
</button>

<label for="previousOdometer">Previous Odometer:</label>
<input
    type="number"
    id="previousOdometer"
    inputmode="numeric"
    onclick="this.select()"
>

<label for="odometer">Ending Odometer: <span class="label-hint">(enter 0 for no odometer)</span></label>
<input
    type="number"
    id="odometer"
    inputmode="numeric"
    onclick="this.select()"
>

<details>
    <summary>Shift Options</summary>

    <label for="breakMins">Unpaid Break:</label>
    <select id="breakMins">
        <option value="0">None</option>
        <option value="15">15 mins</option>
        <option value="30">30 mins</option>
        <option value="45">45 mins</option>
        <option value="60">60 mins (1 hr)</option>
        <option value="90">90 mins (1.5 hrs)</option>
        <option value="120">120 mins (2 hrs)</option>
    </select>

    <div class="checkbox-row">
        <input type="checkbox" id="usePreviousOdometer">
        <label for="usePreviousOdometer">
            Include Miles Driven
        </label>
    </div>

    <div class="checkbox-row">
        <input
            type="checkbox"
            id="useQuarterHour"
            onchange="timeRoundingChanged()"
        >
        <label for="useQuarterHour">
            Use 15-minute increments
        </label>
    </div>
</details>

<button class="primary" onclick="generateLog()">
    Generate & Copy Log
</button>

<label class="output-label" for="output">Output:</label>
<textarea id="output" readonly></textarea>

</div>

<script>

const STORAGE_KEY = "shift_profiles";
const LAST_PROFILE_KEY = "last_active_profile";

let shiftDateWasManuallyChanged = false;

const defaultProfile = {
    name: "Hwy 31 (362304)",
    jobNum: "362304",
    fedProject: "",
    location: "Hwy 31",
    payItem: "424A360",
    truck: "Silver truck",
    startTime: "--",
    endTime: "--",
    previousOdometer: "",
    usePreviousOdometer: false,
    useQuarterHour: false
};


/* -----------------------------
   PROFILE STORAGE
----------------------------- */

function getProfiles() {
    const stored = localStorage.getItem(STORAGE_KEY);

    if (!stored) {
        return [defaultProfile];
    }

    try {
        const profiles = JSON.parse(stored);

        if (!Array.isArray(profiles) || profiles.length === 0) {
            return [defaultProfile];
        }

        profiles.forEach(profile => {
            if (!("previousOdometer" in profile)) {
                profile.previousOdometer = "";
            }

            if (!("usePreviousOdometer" in profile)) {
                profile.usePreviousOdometer = false;
            }

            if (!("useQuarterHour" in profile)) {
                profile.useQuarterHour = false;
            }

            // Compatibility fallback if transitioning from hwy -> location
            if (!("location" in profile) && ("hwy" in profile)) {
                profile.location = profile.hwy;
            }
        });

        return profiles;

    } catch (error) {
        return [defaultProfile];
    }
}


function saveProfiles(profiles) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
}


function renderProfiles() {
    const select = document.getElementById("profileSelect");
    const profiles = getProfiles();

    select.innerHTML = "";

    profiles.forEach((profile, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = profile.name;
        select.appendChild(option);
    });
}


/* -----------------------------
   LOAD PROFILE
----------------------------- */

function loadSelectedProfile() {
    const select = document.getElementById("profileSelect");

    if (select.value === "new") return;

    const profiles = getProfiles();
    const index = Number(select.value);

    if (!profiles[index]) {
        return;
    }

    const profile = profiles[index];

    document.getElementById("jobNum").value = profile.jobNum || "";
    document.getElementById("fedProject").value = profile.fedProject || "";
    document.getElementById("location").value = profile.location || profile.hwy || "";
    document.getElementById("payItem").value = profile.payItem || "";
    document.getElementById("truck").value = profile.truck || "";

    document.getElementById("previousOdometer").value =
        profile.previousOdometer || "";

    document.getElementById("usePreviousOdometer").checked =
        profile.usePreviousOdometer === true;

    document.getElementById("useQuarterHour").checked =
        profile.useQuarterHour === true;

    populateTimes(profile.useQuarterHour === true);

    document.getElementById("startTime").value =
        profile.startTime || "--";

    document.getElementById("endTime").value =
        profile.endTime || "--";

    updateNowButtonText();

    localStorage.setItem(LAST_PROFILE_KEY, String(index));
}


/* -----------------------------
   NEW PROFILE
----------------------------- */

function createNewBlankProfile() {
    const select = document.getElementById("profileSelect");

    let newOption = select.querySelector('option[value="new"]');
    if (!newOption) {
        newOption = document.createElement("option");
        newOption.value = "new";
        newOption.textContent = "-- Unsaved New Profile --";
        select.appendChild(newOption);
    }
    newOption.selected = true;
    select.value = "new";

    document.getElementById("jobNum").value = "";
    document.getElementById("fedProject").value = "";
    document.getElementById("location").value = "";
    document.getElementById("payItem").value = "";
    document.getElementById("truck").value = "";

    document.getElementById("useQuarterHour").checked = false;
    populateTimes(false);

    document.getElementById("startTime").value = "--";
    document.getElementById("endTime").value = "--";

    document.getElementById("previousOdometer").value = "";
    document.getElementById("usePreviousOdometer").checked = false;

    shiftDateWasManuallyChanged = false;
    updateAutomaticShiftDate();

    updateNowButtonText();

    document.getElementById("jobDetailsPanel").open = true;
    document.getElementById("jobNum").focus();
}


/* -----------------------------
   SAVE PROFILE
----------------------------- */

function saveProfile() {
    const profiles = getProfiles();
    const select = document.getElementById("profileSelect");

    let selectedIndex = select.value === "new" ? -1 : Number(select.value);
    let existingProfile = profiles[selectedIndex];

    let profileName;

    if (existingProfile) {
        const overwrite = confirm("Overwrite the current profile?");
        if (!overwrite) return;

        profileName = existingProfile.name;

    } else {
        const locVal = document.getElementById("location").value.trim();
        const jobVal = document.getElementById("jobNum").value.trim();
        const payVal = document.getElementById("payItem").value.trim();
        const truckVal = document.getElementById("truck").value.trim();

        let defaultName = "";

        if (locVal && jobVal) {
            defaultName = `${locVal} (${jobVal})`;
        } else if (locVal) {
            defaultName = locVal;
        } else if (jobVal) {
            defaultName = `Job ${jobVal}`;
        } else if (payVal) {
            defaultName = `Pay Item ${payVal}`;
        } else if (truckVal) {
            defaultName = truckVal;
        } else {
            defaultName = "Plant Day";
        }

        profileName = prompt("Enter a name for this profile:", defaultName);

        if (!profileName) return;
    }

    const profile = {
        name: profileName,
        jobNum: document.getElementById("jobNum").value.trim(),
        fedProject: document.getElementById("fedProject").value.trim(),
        location: document.getElementById("location").value.trim(),
        payItem: document.getElementById("payItem").value.trim(),
        truck: document.getElementById("truck").value.trim(),
        startTime: document.getElementById("startTime").value,
        endTime: document.getElementById("endTime").value,
        previousOdometer: document.getElementById("previousOdometer").value.trim(),
        usePreviousOdometer:
            document.getElementById("usePreviousOdometer").checked,
        useQuarterHour:
            document.getElementById("useQuarterHour").checked
    };

    if (existingProfile) {
        profiles[selectedIndex] = profile;
    } else {
        profiles.push(profile);
    }

    saveProfiles(profiles);
    renderProfiles();

    const newIndex =
        existingProfile ? selectedIndex : profiles.length - 1;

    document.getElementById("profileSelect").value = String(newIndex);

    localStorage.setItem(
        LAST_PROFILE_KEY,
        String(newIndex)
    );

    alert("Profile saved.");
}


/* -----------------------------
   DELETE PROFILE
----------------------------- */

function deleteProfile() {
    const select = document.getElementById("profileSelect");

    if (select.value === "new") {
        renderProfiles();
        loadSelectedProfile();
        return;
    }

    const profiles = getProfiles();
    const index = Number(select.value);

    if (!profiles[index]) return;

    const confirmed = confirm("Delete the current profile?");

    if (!confirmed) return;

    profiles.splice(index, 1);

    if (profiles.length === 0) {
        profiles.push(defaultProfile);
    }

    saveProfiles(profiles);
    localStorage.removeItem(LAST_PROFILE_KEY);

    renderProfiles();
    createNewBlankProfile();
}


/* -----------------------------
   TIME DROPDOWNS
----------------------------- */

function populateTimes(useQuarterHour) {
    const start = document.getElementById("startTime");
    const end = document.getElementById("endTime");

    const oldStart = start.value;
    const oldEnd = end.value;

    start.innerHTML = "";
    end.innerHTML = "";

    const placeholder1 = document.createElement("option");
    placeholder1.value = "--";
    placeholder1.textContent = "--";
    start.appendChild(placeholder1);

    const placeholder2 = document.createElement("option");
    placeholder2.value = "--";
    placeholder2.textContent = "--";
    end.appendChild(placeholder2);

    const increment = useQuarterHour ? 15 : 30;

    for (let hour = 0; hour < 24; hour++) {

        for (let minute = 0; minute < 60; minute += increment) {

            const value =
                String(hour).padStart(2, "0") +
                ":" +
                String(minute).padStart(2, "0");

            const option1 = document.createElement("option");
            option1.value = value;
            option1.textContent = formatTime(value);
            start.appendChild(option1);

            const option2 = document.createElement("option");
            option2.value = value;
            option2.textContent = formatTime(value);
            end.appendChild(option2);
        }
    }

    if (oldStart && oldStart !== "--") {
        const startOptionExists =
            Array.from(start.options).some(
                option => option.value === oldStart
            );

        if (startOptionExists) {
            start.value = oldStart;
        } else {
            start.value = "--";
        }
    } else {
        start.value = "--";
    }

    if (oldEnd && oldEnd !== "--") {
        const endOptionExists =
            Array.from(end.options).some(
                option => option.value === oldEnd
            );

        if (endOptionExists) {
            end.value = oldEnd;
        } else {
            end.value = "--";
        }
    } else {
        end.value = "--";
    }
}


function timeRoundingChanged() {
    const useQuarterHour =
        document.getElementById("useQuarterHour").checked;

    populateTimes(useQuarterHour);
    updateNowButtonText();
    updateAutomaticShiftDate();
}


function updateNowButtonText() {
    const useQuarterHour =
        document.getElementById("useQuarterHour").checked;

    const button = document.getElementById("nowButton");

    if (useQuarterHour) {
        button.textContent =
            "Set End Time to NOW (Rounded 15m)";
    } else {
        button.textContent =
            "Set End Time to NOW (Rounded 30m)";
    }
}


function formatTime(timeValue) {
    const parts = timeValue.split(":");

    let hour = Number(parts[0]);
    const minute = parts[1];

    const suffix = hour >= 12 ? "PM" : "AM";

    hour = hour % 12;

    if (hour === 0) {
        hour = 12;
    }

    return hour + ":" + minute + " " + suffix;
}


/* -----------------------------
   AUTOMATIC SHIFT DATE
----------------------------- */

function shiftDateManuallyChanged() {
    const dateValue =
        document.getElementById("shiftDate").value;

    shiftDateWasManuallyChanged = !!dateValue;
}


function updateAutomaticShiftDate() {
    if (shiftDateWasManuallyChanged) return;

    const startVal =
        document.getElementById("startTime").value;

    const endVal =
        document.getElementById("endTime").value;

    if (!startVal || startVal === "--" ||
        !endVal || endVal === "--") {
        return;
    }

    const startParts = startVal.split(":");
    const endParts = endVal.split(":");

    const startMinutes =
        Number(startParts[0]) * 60 +
        Number(startParts[1]);

    const endMinutes =
        Number(endParts[0]) * 60 +
        Number(endParts[1]);

    const date = new Date();

    if (endMinutes < startMinutes) {
        date.setDate(date.getDate() - 1);
    }

    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    const dd = String(date.getDate()).padStart(2, "0");

    document.getElementById("shiftDate").value =
        yyyy + "-" + mm + "-" + dd;
}


/* -----------------------------
   SET END TIME TO NOW
----------------------------- */

function setEndToNow() {
    const now = new Date();

    let hour = now.getHours();
    let minute = now.getMinutes();

    const useQuarterHour =
        document.getElementById("useQuarterHour").checked;

    if (useQuarterHour) {

        if (minute < 8) {
            minute = 0;

        } else if (minute < 23) {
            minute = 15;

        } else if (minute < 38) {
            minute = 30;

        } else if (minute < 53) {
            minute = 45;

        } else {
            minute = 0;
            hour++;

            if (hour >= 24) {
                hour = 0;
            }
        }

    } else {

        if (minute < 15) {
            minute = 0;

        } else if (minute < 45) {
            minute = 30;

        } else {
            minute = 0;
            hour++;

            if (hour >= 24) {
                hour = 0;
            }
        }
    }

    const value =
        String(hour).padStart(2, "0") +
        ":" +
        String(minute).padStart(2, "0");

    document.getElementById("endTime").value = value;

    if (!shiftDateWasManuallyChanged) {
        const startVal =
            document.getElementById("startTime").value;

        const targetDate = new Date(now);

        if (startVal && startVal !== "--") {
            const startParts = startVal.split(":");
            const startMinutes =
                Number(startParts[0]) * 60 +
                Number(startParts[1]);

            const endMinutes =
                hour * 60 + minute;

            if (endMinutes < startMinutes) {
                targetDate.setDate(targetDate.getDate() - 1);
            }
        }

        const yyyy = targetDate.getFullYear();
        const mm = String(targetDate.getMonth() + 1).padStart(2, "0");
        const dd = String(targetDate.getDate()).padStart(2, "0");

        document.getElementById("shiftDate").value =
            yyyy + "-" + mm + "-" + dd;
    }
}


/* -----------------------------
   DATE FORMATTING
----------------------------- */

const days = [
    "Sun", "Mon", "Tue", "Wed",
    "Thu", "Fri", "Sat"
];

const months = [
    "Jan", "Feb", "Mar", "Apr",
    "May", "Jun", "Jul", "Aug",
    "Sep", "Oct", "Nov", "Dec"
];


function formatDate(date) {
    return (
        days[date.getDay()] +
        " " +
        months[date.getMonth()] +
        " " +
        date.getDate()
    );
}


function formatShiftDates(startDate, endDate) {
    const startYear = startDate.getFullYear();
    const endYear = endDate.getFullYear();

    if (startYear !== endYear) {
        return (
            formatDate(startDate) +
            ", " +
            startYear +
            " - " +
            formatDate(endDate) +
            ", " +
            endYear
        );
    }

    if (startDate.getMonth() !== endDate.getMonth()) {
        return (
            formatDate(startDate) +
            "-" +
            formatDate(endDate)
        );
    }

    if (startDate.getDate() !== endDate.getDate()) {
        return (
            days[startDate.getDay()] +
            "-" +
            days[endDate.getDay()] +
            " " +
            months[startDate.getMonth()] +
            " " +
            startDate.getDate() +
            "-" +
            endDate.getDate()
        );
    }

    return formatDate(startDate);
}


/* -----------------------------
   GENERATE LOG
----------------------------- */

function generateLog() {

    if (!shiftDateWasManuallyChanged) {
        updateAutomaticShiftDate();
    }

    const jobNum =
        document.getElementById("jobNum").value.trim();

    const fedProject =
        document.getElementById("fedProject").value.trim();

    const locationVal =
        document.getElementById("location").value.trim();

    const payItem =
        document.getElementById("payItem").value.trim();

    const truck =
        document.getElementById("truck").value.trim();

    const startTime =
        document.getElementById("startTime").value;

    const endTime =
        document.getElementById("endTime").value;

    const breakMins =
        Number(document.getElementById("breakMins").value);

    const shiftDateValue =
        document.getElementById("shiftDate").value;

    const previousOdometer =
        document.getElementById("previousOdometer").value.trim();

    const usePreviousOdometer =
        document.getElementById("usePreviousOdometer").checked;

    const odometer =
        document.getElementById("odometer").value.trim();


    /* -----------------------------
       VALIDATION
    ----------------------------- */

    if (!startTime || startTime === "--") {
        alert("Please select a Start Time.");
        document.getElementById("startTime").focus();
        return;
    }

    if (!endTime || endTime === "--") {
        alert("Please select an End Time.");
        document.getElementById("endTime").focus();
        return;
    }

    if (odometer === "") {
        alert("Please enter the Ending Odometer (or enter 0 for personal vehicle).");
        document.getElementById("odometer").focus();
        return;
    }

    if (!shiftDateValue) {
        alert("Please select a Start Date of Shift.");
        document.getElementById("shiftDate").focus();
        return;
    }


    /* -----------------------------
       MILEAGE VALIDATION
    ----------------------------- */

    let milesDriven = null;

    if (usePreviousOdometer && odometer !== "0") {

        if (!previousOdometer) {
            alert(
                "Include Miles Driven is checked, but Previous Odometer is blank."
            );

            document.getElementById("previousOdometer").focus();
            return;
        }

        const previous = Number(previousOdometer);
        const ending = Number(odometer);

        if (ending < previous) {
            alert(
                "Ending odometer cannot be less than Previous Odometer."
            );

            document.getElementById("odometer").focus();
            return;
        }

        milesDriven = ending - previous;
    }


    /* -----------------------------
       CREATE SHIFT DATES
    ----------------------------- */

    const startDateParts =
        shiftDateValue.split("-");

    const startDate = new Date(
        Number(startDateParts[0]),
        Number(startDateParts[1]) - 1,
        Number(startDateParts[2])
    );

    const startParts = startTime.split(":");
    const endParts = endTime.split(":");

    const startHour = Number(startParts[0]);
    const startMinute = Number(startParts[1]);

    const endHour = Number(endParts[0]);
    const endMinute = Number(endParts[1]);


    const start = new Date(startDate);

    start.setHours(
        startHour,
        startMinute,
        0,
        0
    );


    const end = new Date(startDate);

    end.setHours(
        endHour,
        endMinute,
        0,
        0
    );


    if (
        endHour * 60 + endMinute <=
        startHour * 60 + startMinute
    ) {
        end.setDate(end.getDate() + 1);
    }


    /* -----------------------------
       CALCULATION WITH UNPAID BREAK
    ----------------------------- */

    let totalHours = ((end - start) / (1000 * 60 * 60)) - (breakMins / 60);
    if (totalHours < 0) totalHours = 0;


    /* -----------------------------
       DAYLIGHT SAVING TIME
       DETECTION & USER REVIEW
    ----------------------------- */

    let dstNote = "";

    const crossedDST =
        start.getTimezoneOffset() !==
        end.getTimezoneOffset();

    if (crossedDST) {

        const suggestedAdjustment =
            start.getTimezoneOffset() > end.getTimezoneOffset()
                ? "+1 hour (Spring Forward)"
                : "-1 hour (Fall Back)";

        const choice = prompt(
            "Daylight Saving Time change detected.\n\n" +
            "Calculated Hours: " + totalHours + "\n\n" +
            "Depending on how the times were recorded,\n" +
            "the shift may need a DST adjustment to match clock face hours.\n\n" +
            "Suggested change: " + suggestedAdjustment + "\n\n" +
            "Choose:\n" +
            "K = Keep calculated hours\n" +
            "A = Add 1 hour\n" +
            "S = Subtract 1 hour",
            "K"
        );

        const selection =
            (choice || "K").trim().toUpperCase();

        if (selection === "A") {

            totalHours += 1;

            dstNote =
                " (DST reviewed: +1 hr applied)";

        } else if (selection === "S") {

            totalHours -= 1;

            if (totalHours < 0) {
                totalHours = 0;
            }

            dstNote =
                " (DST reviewed: -1 hr applied)";

        } else {

            dstNote =
                " (DST reviewed: no adjustment)";
        }
    }


    /* -----------------------------
       LONG SHIFT WARNING
    ----------------------------- */

    if (totalHours < 4 || totalHours > 16) {

        const proceed = confirm(
            "This shift calculates to " +
            totalHours +
            " hours.\n\n" +
            "Are you sure the start and end times are correct?"
        );

        if (!proceed) return;
    }


    /* -----------------------------
       BUILD OUTPUT
    ----------------------------- */

    const lines = [];

    if (jobNum) {
        lines.push("Job#: " + jobNum);
    }

    if (fedProject) {
        lines.push(fedProject);
    }

    if (locationVal) {
        lines.push(locationVal);
    }

    if (payItem) {
        lines.push(payItem);
    }

    lines.push(
        "Date: " +
        formatShiftDates(start, end)
    );

    lines.push(
        "Hours: " +
        formatTime(startTime) +
        " - " +
        formatTime(endTime) +
        " (" +
        totalHours +
        " hours)" +
        dstNote
    );

    if (breakMins > 0) {
        lines.push("Break: " + breakMins + "m unpaid");
    }

    if (odometer !== "0") {
        lines.push("Odometer: " + odometer);
    }

    if (usePreviousOdometer && milesDriven !== null) {
        lines.push("Miles: " + milesDriven);
    }

    if (truck) {
        lines.push(truck);
    }


    const output = lines.join("\n");

    document.getElementById("output").value =
        output;

    copyText(output);

    if (odometer !== "0") {
        updateProfilePreviousOdometer(odometer);
    }
}


/* -----------------------------
   SAVE CURRENT ODOMETER
   AS PROFILE'S PREVIOUS ODOMETER
----------------------------- */

function updateProfilePreviousOdometer(odometer) {

    const select =
        document.getElementById("profileSelect");

    if (select.value === "new") return;

    const profiles = getProfiles();

    const index =
        Number(select.value);

    if (profiles[index]) {

        profiles[index].previousOdometer =
            String(odometer);

        profiles[index].usePreviousOdometer =
            document.getElementById(
                "usePreviousOdometer"
            ).checked;

        profiles[index].useQuarterHour =
            document.getElementById(
                "useQuarterHour"
            ).checked;

        saveProfiles(profiles);
    }

    document.getElementById(
        "previousOdometer"
    ).value = String(odometer);
}


/* -----------------------------
   COPY
----------------------------- */

function copyText(text) {

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(text)
            .then(() => {
                alert("Log copied to clipboard.");
            })
            .catch(() => {
                fallbackCopy(text);
            });

    } else {
        fallbackCopy(text);
    }
}


function fallbackCopy(text) {

    const textarea =
        document.getElementById("output");

    textarea.focus();
    textarea.select();

    try {

        document.execCommand("copy");

        alert("Log copied to clipboard.");

    } catch (error) {

        alert(
            "Log generated, but automatic copying failed. " +
            "Please copy the text manually."
        );
    }
}


/* -----------------------------
   INITIALIZATION
----------------------------- */

function init() {

    populateTimes(false);
    renderProfiles();

    const today = new Date();

    const yyyy =
        today.getFullYear();

    const mm =
        String(today.getMonth() + 1)
            .padStart(2, "0");

    const dd =
        String(today.getDate())
            .padStart(2, "0");

    document.getElementById("shiftDate").value =
        yyyy + "-" + mm + "-" + dd;

    shiftDateWasManuallyChanged = false;


    const profiles = getProfiles();

    const lastProfile =
        localStorage.getItem(
            LAST_PROFILE_KEY
        );


    if (
        lastProfile !== null &&
        profiles[Number(lastProfile)]
    ) {

        document.getElementById(
            "profileSelect"
        ).value = lastProfile;

    } else {

        document.getElementById(
            "profileSelect"
        ).value = "0";
    }


    loadSelectedProfile();

    document.getElementById(
        "odometer"
    ).value = "";
}


window.onload = init;

</script>
