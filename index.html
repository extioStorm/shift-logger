<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Logger</title>

<link rel="icon" type="image/png" sizes="48x48" href="shift-logger-favicon-48.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<h2>Shift Logger</h2>

<div class="profile-row">
    <select id="profileSelect"></select>
    <button class="small-button secondary" id="newProfileBtn">+ New</button>
</div>

<details id="jobDetailsPanel">
    <summary>Job &amp; Project Details</summary>

    <label for="jobNum">Job Number:</label>
    <input type="text" id="jobNum" autocomplete="off">

    <label for="fedProject">State/Federal Project ID:</label>
    <input type="text" id="fedProject" autocomplete="off">

    <div class="two-column" style="width: 100%; margin: 0;">
        <div>
            <label for="location">Location:</label>
            <input type="text" id="location" autocomplete="off">
        </div>

        <div>
            <label for="payItem">Pay Item / Code:</label>
            <input type="text" id="payItem" autocomplete="off">
        </div>
    </div>

    <label for="truck">Vehicle / Notes:</label>
    <input type="text" id="truck" autocomplete="off">

    <!-- Boss Phone inside profile settings with matching alignment -->
    <label for="bossPhone">Boss's Phone Number:</label>
    <div style="display: flex; gap: 6px; align-items: center;">
        <input 
            type="tel" 
            id="bossPhone" 
            placeholder="e.g. 555-123-4567" 
            autocomplete="tel"
            style="flex: 1; min-width: 0;"
        >
        <button 
            type="button" 
            id="pickContactBtn" 
            class="secondary small-button" 
            style="margin-top: 0;"
        >
            📇 Pick
        </button>
    </div>

    <div class="profile-buttons" style="width: 100%; margin: 8px 0 0 0;">
        <button class="secondary" id="saveProfileBtn">Save Profile</button>
        <button class="danger" id="deleteProfileBtn">Delete Profile</button>
    </div>
</details>

<label for="shiftDate">Start Date of Shift:</label>
<input type="date" id="shiftDate">

<div class="two-column" style="margin-top: 4px;">
    <div>
        <label for="startTime">Start Time:</label>
        <select id="startTime"></select>
    </div>

    <div>
        <label for="endTime">End Time:</label>
        <select id="endTime"></select>
    </div>
</div>

<div id="unpaidBreakGroup" style="display: none;">
    <label for="breakMins">Unpaid Break:</label>
    <select id="breakMins">
        <option value="0">None</option>
        <option value="15">15 mins</option>
        <option value="30">30 mins</option>
        <option value="45">45 mins</option>
        <option value="60">60 mins (1 hr)</option>
        <option value="90">90 mins (1.5 hrs)</option>
        <option value="120">120 mins (2 hrs)</option>
    </select>
</div>

<button class="now-button" id="nowButton">
    Set End Time to NOW (Rounded 30m)
</button>

<!-- Previous Odometer dynamically hidden/shown based on 'Show Previous Odometer' check -->
<div id="previousOdometerGroup" style="display: none;">
    <label for="previousOdometer">Previous Odometer:</label>
    <input
        type="number"
        id="previousOdometer"
        inputmode="numeric"
    >
</div>

<label for="odometer">Ending Odometer: <span class="label-hint">(0 for none)</span></label>
<input
    type="number"
    id="odometer"
    inputmode="numeric"
>

<details id="shiftOptionsPanel">
    <summary>Shift Options</summary>

    <div class="options-grid">
        <div class="checkbox-row">
            <input type="checkbox" id="showPreviousOdometer">
            <label for="showPreviousOdometer">Show Previous Odometer</label>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="includeMilesDriven" disabled>
            <label for="includeMilesDriven">Include Driven Miles</label>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="useQuarterHour">
            <label for="useQuarterHour">Use 15-minute increments</label>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="showUnpaidBreak">
            <label for="showUnpaidBreak">Show unpaid break</label>
        </div>
    </div>

    <button type="button" class="secondary" style="width: 80%; margin: 8px auto 0; display: block; padding: 6px 8px; font-size: 14px;" id="saveSettingsBtn">Save Settings &amp; Profile</button>
</details>

<button class="primary" id="generateBtn">
    Generate &amp; Copy Log
</button>

<label class="output-label" for="output">Output:</label>
<textarea id="output" readonly></textarea>

<!-- Send to Boss button positioned underneath the Output -->
<button type="button" class="sms-button" id="sendBtn">
    ✉️ Send to Boss (SMS)
</button>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="odometerDialog" aria-labelledby="odometerDialogText">
    <p id="odometerDialogText"></p>
    <button type="button" class="primary" id="odoReplaceBtn">Replace earlier reading</button>
    <button type="button" class="secondary" id="odoNewBtn">Add as new reading</button>
    <button type="button" class="secondary" id="odoCancelBtn">Cancel</button>
</dialog>

<button id="installButton" class="secondary" style="display:none; width:100%; margin-top:10px;">
    📲 Install App
</button>

</div>

<script src="app.js"></script>

</body>
</html>
